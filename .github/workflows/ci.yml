name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      # --pretty false: o formato simples vira anotação com arquivo e linha no GitHub.
      - name: Checar tipos (TypeScript)
        run: npx tsc -b --pretty false

      - name: Testes
        if: success() || failure()
        run: npx vitest run --reporter=default --reporter=github-actions

      # Falas do Pretor com voz neural (Piper, gratuito). Se falhar, o site sai assim
      # mesmo e o jogo usa a voz do navegador.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache das vozes do Piper
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            scripts/vozes/.modelos
          key: piper-vozes-v1

      - name: Gerar as falas do Pretor (Piper)
        continue-on-error: true
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install piper-tts==1.2.0
          python scripts/vozes/gerar.py

      - name: Build de produção
        run: npx vite build

      - name: Guardar o site para publicação
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
